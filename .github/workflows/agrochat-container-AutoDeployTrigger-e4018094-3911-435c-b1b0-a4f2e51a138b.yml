name: Trigger auto deployment for agrochat-container

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/agrochat-container-AutoDeployTrigger-e4018094-3911-435c-b1b0-a4f2e51a138b.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AGROCHATCONTAINER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AGROCHATCONTAINER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AGROCHATCONTAINER_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: agroaicontainer.azurecr.io
          registryUsername: ${{ secrets.AGROCHATCONTAINER_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.AGROCHATCONTAINER_REGISTRY_PASSWORD }}
          containerAppName: agrochat-container
          resourceGroup: Agro-AI-Tools
          imageToBuild: agroaicontainer.azurecr.io/agrochat-container:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


